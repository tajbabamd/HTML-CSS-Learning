<!DOCTYPE html>
<html>
<head>
  <style>
    .simple {
      text-shadow: 3px 3px red;
    }

    .fuzzy {
      text-shadow: 3px 3px 6px violet;
      font-size: 30px;
      text-align: center;
    }

    .multi {
      text-shadow: -3px -3px 3px blue, 3px 3px 3px red;
      font-size: 30px;
      text-align: center;
    }

    .glow {
      text-shadow: 0 0 4px cyan;
      font-size: 50px;
      text-align: center;
    }
  </style>
</head>

<body>
  <h1 class="simple">
    Simple Shadow
  </h1>

  <h2 class="fuzzy">
    Fuzzy Shadow
  </h2>

  <h3 class="multi">
    Multiple Shadows
  </h3>

  <h4 class="glow">
    Glow Effect
  </h4>

</body>

</html>
