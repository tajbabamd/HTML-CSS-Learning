<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Video Background Example</title>
  <!-- <link rel="stylesheet" href="style.css"> -->
   <style>
    /* Make video cover the entire background */
#bg-video {
  position: fixed;       /* stays in place while scrolling */
  right: 0;
  bottom: 0;
  min-width: 100%;
  min-height: 100%;
  object-fit: cover;     /* ensures video fills screen */
  z-index: -1;           /* pushes video behind content */
}

/* Style content */
.content {
  position: relative;
  z-index: 1;            /* ensures text is above video */
  color: white;
  text-align: center;
  margin-top: 20%;
  font-family: Arial, sans-serif;
}
   </style>
</head>
<body>
  <!-- Background video -->
  <video autoplay muted loop id="bg-video">
    <source src="videos/deliviry.mp4" type="video/mp4">
    Your browser does not support the video tag.
  </video>

  <!-- Content on top -->
  <div class="content">
    <h1>Welcome to My Page</h1>
    <p>This text floats over the video background.</p>
  </div>
</body>
</html>
